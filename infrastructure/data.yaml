AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CSVForge Data Layer — S3 bucket for CSV uploads and processed output.
  Single bucket holds both raw uploads (uploads/ prefix) and processed results
  (processed/ prefix). Public access blocked. SSE-S3 encryption. CORS enabled
  for browser direct upload via presigned PUT URL (AD-02).

Parameters:
  BucketName:
    Type: String
    Default: csvforge-files-dev
    Description: >
      Globally unique bucket name. Must be lowercase, 3-63 chars, no underscores.
      The "dev" suffix distinguishes this from staging/production buckets.
      AWS S3 bucket names are globally unique across ALL AWS accounts worldwide —
      if someone else already owns "csvforge-files-dev", creation will fail.

Resources:

  # ── Primary S3 Bucket ──────────────────────────────────────────────────────
  # This single bucket holds BOTH raw uploads and processed outputs, separated
  # by key prefix ("uploads/" vs "processed/"). Using one bucket simplifies
  # the IAM policy: the Lambda worker needs read from "uploads/" and write to
  # "processed/" — both on the same bucket ARN.
  CSVForgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

      # ── Block ALL public access ─────────────────────────────────────────────
      # S3 has multiple independent layers that can grant public access.
      # Blocking all four here ensures no misconfigured bucket policy or ACL
      # can accidentally expose uploaded files to the internet.
      #
      # BlockPublicAcls:       Reject any PUT that would attach a public ACL.
      # IgnorePublicAcls:      Ignore any existing public ACLs (defense in depth).
      # BlockPublicPolicy:     Reject bucket policy changes that grant public access.
      # RestrictPublicBuckets: Even if a policy grants public access somehow,
      #                        don't honor it for unauthenticated requests.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      # ── Versioning (disabled for dev) ──────────────────────────────────────
      # Versioning would keep every overwritten or deleted version of every
      # object. Useful for production (accidental deletes recoverable), but
      # adds storage cost and complexity for the dev environment.
      # Enable for production stacks.
      VersioningConfiguration:
        Status: Suspended

      # ── Server-side encryption ─────────────────────────────────────────────
      # S3-managed keys (SSE-S3) encrypts every object at rest automatically.
      # The key is managed by AWS — no extra cost, no key rotation to manage.
      # For stricter compliance requirements, replace with SSE-KMS (customer-
      # managed key), which provides audit logs in CloudTrail and key rotation
      # control.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      # ── CORS configuration for browser direct upload ───────────────────────
      # CORS (Cross-Origin Resource Sharing) is a browser security feature.
      # By default, a browser running at http://localhost:5173 (Vite dev server)
      # CANNOT make a PUT request to https://s3.amazonaws.com/... because those
      # are different origins. The browser blocks the request before it sends.
      #
      # S3's CORS configuration tells the browser: "requests from these origins
      # are allowed for these HTTP methods." This enables the presigned PUT
      # upload flow: the browser POSTs to FastAPI to get a presigned URL, then
      # PUTs the file directly to S3.
      #
      # WHY "PUT" ONLY:
      #   The browser only needs PUT to upload. GET requests for download also
      #   use presigned URLs but are typically triggered by <a href="..."> links
      #   or fetch() calls that S3 CORS allows via AllowedOrigins + GET. We keep
      #   the permission surface minimal: only what the browser workflow needs.
      #
      # WHY ExposeHeaders ETag:
      #   The ETag is S3's checksum for the uploaded object. After the PUT
      #   succeeds, the browser can read the ETag from the response headers
      #   and send it to FastAPI's /uploads/{job_id}/complete endpoint as proof
      #   that the upload completed. Without ExposeHeaders, the browser cannot
      #   read the ETag from the cross-origin response.
      #
      # AllowedOrigins in production:
      #   Replace http://localhost:5173 with your production frontend domain.
      #   Wildcards (*) should not be used in production — they would allow
      #   any website to PUT files into the bucket using a presigned URL.
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "http://localhost:5173"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

      # ── Lifecycle rules (optional, disabled by default) ────────────────────
      # Lifecycle rules automatically transition or delete objects after N days.
      # For production: consider moving "uploads/" to Glacier after 90 days
      # (raw uploads are no longer needed after processing). For dev, we leave
      # this unconfigured to avoid accidentally deleting test data.

Outputs:
  BucketName:
    Description: Name of the S3 bucket for CSV uploads and processed outputs.
    Value: !Ref CSVForgeBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  BucketArn:
    Description: >
      ARN of the S3 bucket. Used in IAM policy Resource fields:
        "Resource": ["<BucketArn>", "<BucketArn>/*"]
      The first ARN grants bucket-level permissions (ListBucket);
      the second ARN (with /*) grants object-level permissions (GetObject, PutObject).
      You need BOTH for most real workflows.
    Value: !GetAtt CSVForgeBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"
