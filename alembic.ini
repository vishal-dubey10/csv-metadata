# ─────────────────────────────────────────────────────────────
# alembic.ini — Alembic configuration file
#
# WHAT:
#   This is the top-level configuration file for Alembic, the database
#   migration tool. It tells Alembic where to find its scripts, how to
#   format generated file names, and how to configure its logging output.
#
# WHY:
#   When you run `alembic upgrade head` or any other alembic command,
#   Alembic looks for alembic.ini in the current directory (or the path
#   you specify with -c). This file is the entry point that tells Alembic
#   everything it needs to know before running.
#
# HOW IT RELATES TO env.py:
#   alembic.ini provides static configuration (file paths, log levels).
#   env.py (at script_location/env.py) provides dynamic configuration:
#     - reads DATABASE_URL from the environment at runtime
#     - imports SQLAlchemy models to register their schemas
#   env.py overrides sqlalchemy.url from this file with the real URL.
#
# WHY THE DATABASE URL IS NOT HERE:
#   Hardcoding credentials in a config file would mean they end up in
#   version control (committed to git). This is a serious security risk.
#   Instead, env.py reads DATABASE_URL from an environment variable or
#   .env file at runtime, and injects it via config.set_main_option().
#   This file's sqlalchemy.url is left intentionally blank.
#
# USAGE (run from the project root, where this file lives):
#   alembic upgrade head        — apply all pending migrations
#   alembic downgrade -1        — reverse the most recent migration
#   alembic history             — list all migrations in the chain
#   alembic current             — show which revision is currently applied
#   alembic revision --autogenerate -m "add column"   — generate a new migration
#   alembic upgrade head --sql  — print the SQL without connecting (offline mode)
# ─────────────────────────────────────────────────────────────

[alembic]
# script_location: path to the directory containing:
#   env.py             — the configuration script (runs on every alembic command)
#   script.py.mako     — template for new migration files
#   versions/          — directory where migration files are stored
#
# Relative to the directory containing this alembic.ini file (project root).
# We put migrations inside backend/ to keep all Python code together.
script_location = backend/alembic

# sqlalchemy.url is intentionally left blank.
# Alembic uses this setting to connect to the database, but we override it
# in env.py by calling config.set_main_option("sqlalchemy.url", DATABASE_URL).
# This prevents credentials from being stored in version control.
# If you were to set it here, the format would be:
#   sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/dbname
# sqlalchemy.url =   ← intentionally blank

# file_template: naming convention for auto-generated migration files.
#
# The tokens are:
#   %(rev)s  — the short revision hash (e.g., "a1b2c3d4" or "0001")
#   %(slug)s — a truncated, slugified version of the -m "message" argument
#              Alembic lowercases the message and replaces spaces with underscores.
#              "add users table" → "add_users_table"
#
# Example: `alembic revision --autogenerate -m "add users table"`
# generates: abc123def456_add_users_table.py
#
# WHY this format?
#   Files sort lexicographically in the `versions/` directory because the
#   revision ID prefix is prepended. This means `ls versions/` or any file
#   browser shows migrations in chronological order — you can read the full
#   migration history just by looking at filenames, without running
#   `alembic history`. Compare to Alembic's default format, which would
#   produce "abc123def456.py" — opaque until you open the file.
file_template = %%(rev)s_%%(slug)s

# prepend_sys_path: directories to add to Python's sys.path before running env.py.
#
# sys.path is the list of directories Python searches when resolving imports.
# '.' means "the directory containing this alembic.ini file" (the project root).
#
# WHY this is needed:
#   env.py contains `from backend.db.connection import Base, DATABASE_URL`.
#   For this import to work, Python must be able to find the `backend` package.
#   Adding the project root to sys.path makes `backend/` findable as a package.
#   Without this, you'd get: ModuleNotFoundError: No module named 'backend'
#
# This is equivalent to running `export PYTHONPATH=.` in your shell before the
# alembic command, but it's automatic — the setting is baked into alembic.ini
# so no manual step is required.
prepend_sys_path = .

# truncate_slug_length: maximum characters for the slug part of the filename.
# Keeps filenames from becoming unwieldy long for verbose -m messages.
truncate_slug_length = 40

[post_write_hooks]
# post_write_hooks run automatically after Alembic generates a new migration file.
# Common use: auto-format with Black or sort imports with isort.
# Uncomment to enable:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# ── Logging configuration ─────────────────────────────────────────────────────
# Alembic uses Python's standard logging module with its own named loggers.
# The sections below configure what gets logged to the console.
#
# Key loggers:
#   root         — catch-all for any unspecified logger
#   sqlalchemy   — SQLAlchemy engine messages (SQL statements, connection events)
#   alembic      — Alembic's own operation messages ("Running upgrade 0001 -> ...")
#
# The [loggers], [handlers], and [formatters] sections use Python's standard
# logging configuration format (logging.config.fileConfig). Each section has
# a `keys=` line that declares the names, and then a [logger_NAME] section
# for each name that sets its level, handler, and logger name (qualname).
#
# To see the SQL that Alembic executes against the database:
#   Change [logger_sqlalchemy] level from WARN to INFO
#   You'll see every CREATE TABLE, CREATE INDEX, and INSERT into alembic_version.
#
# To see SQL WITH bound parameter values (extremely verbose):
#   Change [logger_sqlalchemy] level from WARN to DEBUG
#
# To add the sqlalchemy.engine logger dynamically without editing level settings,
# you can also add `sqlalchemy.engine` to the keys= line:
#   [loggers]
#   keys = root,sqlalchemy,alembic
#   ... and add a [logger_sqlalchemy] section with level=DEBUG
#
# To silence all output except errors:
#   Change [logger_alembic] level from INFO to ERROR
# ─────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

# sqlalchemy logger: controls whether SQLAlchemy logs the SQL it executes.
# WARN (default): silent during normal operation.
# INFO: prints every SQL statement — useful for debugging migration issues.
# DEBUG: extremely verbose — prints SQL + bound parameters.
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# alembic logger: controls Alembic's progress output.
# INFO (default): prints which migration is being applied/reversed.
# Example output: "INFO  [alembic.runtime.migration] Running upgrade  -> 0001, Initial jobs table"
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Console handler: writes log output to stderr.
# stderr is conventionally used for diagnostic output (vs stdout for data).
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Format: "LEVEL [logger_name] message"
# Example: "INFO  [alembic.runtime.migration] Running upgrade  -> 0001"
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
